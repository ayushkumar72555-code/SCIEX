name: SCIEX Desktop Windows Build

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend tooling
        run: npm install

      - name: Build SCIEX desktop application
        uses: tauri-apps/tauri-action@v1.0.0
        with:
          projectPath: .
          tauriScript: npm run tauri
          args: "--verbose"

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: SCIEX-Windows-Installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
